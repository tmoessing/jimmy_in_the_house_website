<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Jimmy in the House</title>
  <link rel="icon" type="image/png" href="logo.jpg" />
  <meta name="theme-color" content="#5b2aa8" />
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jimmy" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#5b2aa8" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <main class="wrap" role="main">
    <div class="top">
      <img src="logo.jpg" alt="Jimmy logo" class="logo" />
      <h1>Welcome to Jimmy in the House</h1>
    </div>

    <p class="sub">You Thought of the Day</p>

    <div id="thought" aria-live="polite" aria-atomic="true">Loading thoughts…</div>
    <button id="shareBtn" class="share-btn" type="button" hidden>Share today's thought</button>
    <div class="hint" id="countdown">Come back tomorrow for a new one</div>

    <section class="archive" id="archive" aria-labelledby="archiveTitle" hidden>
      <h2 id="archiveTitle">Past thoughts</h2>
      <ol id="archiveList"></ol>
      <button id="moreBtn" class="more-btn" type="button" hidden>See past 4 days</button>
    </section>
  </main>

  <!-- Scripts -->
  <script src="config.js?v=9"></script>
  <script src="js/thoughts.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
